<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Notification Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.disconnect {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        button.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .events-container {
            grid-column: 1 / -1;
        }

        .event-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            background: #f8f9fa;
        }

        .event-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-item.ping {
            border-left-color: #4facfe;
        }

        .event-item.NOTIFICATION {
            border-left-color: #667eea;
        }

        .event-item.BIOMETRIC_AUTH_REQUEST {
            border-left-color: #f5576c;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .event-type {
            font-weight: 600;
            color: #333;
        }

        .event-time {
            color: #999;
            font-size: 0.9em;
        }

        .event-data {
            color: #555;
            font-size: 0.95em;
            word-wrap: break-word;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .clear-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Server-Sent Events Demo</h1>
            <p>Real-Time Notification System with Kafka & PostgreSQL</p>
        </div>

        <div class="grid">
            <!-- Connection Card -->
            <div class="card">
                <h2>SSE Connection</h2>
                <div id="connectionStatus" class="status disconnected">
                    Disconnected
                </div>
                <div class="form-group">
                    <label for="userId">User ID:</label>
                    <input type="text" id="userId" placeholder="Enter user ID (e.g., user123)" value="user123">
                </div>
                <button id="connectBtn" onclick="connect()">Connect to SSE</button>
                <button id="disconnectBtn" class="disconnect" onclick="disconnect()" style="display: none;">Disconnect</button>
            </div>

            <!-- Send Notification Card -->
            <div class="card">
                <h2>Send Notification</h2>
                <div class="form-group">
                    <label for="targetUserId">Target User ID:</label>
                    <input type="text" id="targetUserId" placeholder="User ID to send to" value="user123">
                </div>
                <div class="form-group">
                    <label for="eventType">Event Type:</label>
                    <select id="eventType">
                        <option value="NOTIFICATION">Notification</option>
                        <option value="BIOMETRIC_AUTH_REQUEST">Biometric Auth</option>
                        <option value="TRANSACTION_ALERT">Transaction Alert</option>
                        <option value="SYSTEM_MESSAGE">System Message</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" placeholder="Enter your message">Hello! This is a test notification.</textarea>
                </div>
                <button onclick="sendNotification()">Send Notification</button>
                <button class="success" onclick="sendBiometricAuth()">Trigger Biometric Auth</button>
            </div>
        </div>

        <!-- Events Display Card -->
        <div class="card events-container">
            <h2>Received Events</h2>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalEvents">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="connectionTime">0s</div>
                    <div class="stat-label">Connection Time</div>
                </div>
            </div>
            <button class="clear-btn" onclick="clearEvents()">Clear Events</button>
            <div class="event-list" id="eventList">
                <p style="color: #999; text-align: center;">No events received yet. Connect and send a notification!</p>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let eventCount = 0;
        let connectionStartTime = null;
        let connectionTimer = null;

        function updateConnectionStatus(status, message) {
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.className = `status ${status}`;
            statusDiv.textContent = message;
        }

        function updateConnectionTime() {
            if (connectionStartTime) {
                const elapsed = Math.floor((Date.now() - connectionStartTime) / 1000);
                document.getElementById('connectionTime').textContent = elapsed + 's';
            }
        }

        function connect() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                alert('Please enter a user ID');
                return;
            }

            if (eventSource) {
                eventSource.close();
            }

            updateConnectionStatus('connecting', 'Connecting...');

            eventSource = new EventSource(`http://localhost:8080/api/sse/connect?userId=${userId}`);

            eventSource.onopen = function() {
                updateConnectionStatus('connected', `Connected as ${userId}`);
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';
                connectionStartTime = Date.now();
                connectionTimer = setInterval(updateConnectionTime, 1000);
            };

            eventSource.onerror = function(error) {
                console.error('SSE Error:', error);
                updateConnectionStatus('disconnected', 'Connection Error');
                document.getElementById('connectBtn').style.display = 'block';
                document.getElementById('disconnectBtn').style.display = 'none';
                if (connectionTimer) {
                    clearInterval(connectionTimer);
                    connectionTimer = null;
                }
            };

            // Handle ping events
            eventSource.addEventListener('ping', function(event) {
                addEvent('ping', event.data, event.lastEventId);
            });

            // Handle notification events
            eventSource.addEventListener('NOTIFICATION', function(event) {
                addEvent('NOTIFICATION', event.data, event.lastEventId);
            });

            // Handle biometric auth events
            eventSource.addEventListener('BIOMETRIC_AUTH_REQUEST', function(event) {
                addEvent('BIOMETRIC_AUTH_REQUEST', event.data, event.lastEventId);
            });

            // Handle transaction alert events
            eventSource.addEventListener('TRANSACTION_ALERT', function(event) {
                addEvent('TRANSACTION_ALERT', event.data, event.lastEventId);
            });

            // Handle system message events
            eventSource.addEventListener('SYSTEM_MESSAGE', function(event) {
                addEvent('SYSTEM_MESSAGE', event.data, event.lastEventId);
            });
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            updateConnectionStatus('disconnected', 'Disconnected');
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('disconnectBtn').style.display = 'none';
            if (connectionTimer) {
                clearInterval(connectionTimer);
                connectionTimer = null;
            }
        }

        function addEvent(type, data, eventId) {
            eventCount++;
            document.getElementById('totalEvents').textContent = eventCount;

            const eventList = document.getElementById('eventList');

            // Remove placeholder if present
            if (eventCount === 1) {
                eventList.innerHTML = '';
            }

            const eventDiv = document.createElement('div');
            eventDiv.className = `event-item ${type}`;

            const now = new Date().toLocaleTimeString();

            let eventData = data;
            try {
                const parsed = JSON.parse(data);
                eventData = JSON.stringify(parsed, null, 2);
            } catch (e) {
                // Keep as is if not JSON
            }

            eventDiv.innerHTML = `
                <div class="event-header">
                    <span class="event-type">${type}</span>
                    <span class="event-time">${now}</span>
                </div>
                <div class="event-data"><pre>${eventData}</pre></div>
                ${eventId ? `<div style="color: #999; font-size: 0.85em; margin-top: 5px;">Event ID: ${eventId}</div>` : ''}
            `;

            eventList.insertBefore(eventDiv, eventList.firstChild);
        }

        async function sendNotification() {
            const targetUserId = document.getElementById('targetUserId').value.trim();
            const eventType = document.getElementById('eventType').value;
            const message = document.getElementById('message').value.trim();

            if (!targetUserId || !message) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/api/notifications/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: targetUserId,
                        type: eventType,
                        payload: message,
                        persistent: true
                    })
                });

                const result = await response.json();
                console.log('Notification sent:', result);

                // Show feedback
                const originalText = event.target.textContent;
                event.target.textContent = 'Sent!';
                setTimeout(() => {
                    event.target.textContent = originalText;
                }, 2000);
            } catch (error) {
                console.error('Error sending notification:', error);
                alert('Failed to send notification');
            }
        }

        async function sendBiometricAuth() {
            const targetUserId = document.getElementById('targetUserId').value.trim();

            if (!targetUserId) {
                alert('Please enter a target user ID');
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/api/notifications/biometric-auth/${targetUserId}`, {
                    method: 'POST'
                });

                const result = await response.json();
                console.log('Biometric auth sent:', result);

                // Show feedback
                const originalText = event.target.textContent;
                event.target.textContent = 'Auth Request Sent!';
                setTimeout(() => {
                    event.target.textContent = originalText;
                }, 2000);
            } catch (error) {
                console.error('Error sending biometric auth:', error);
                alert('Failed to send biometric auth');
            }
        }

        function clearEvents() {
            document.getElementById('eventList').innerHTML = '<p style="color: #999; text-align: center;">No events received yet. Connect and send a notification!</p>';
            eventCount = 0;
            document.getElementById('totalEvents').textContent = '0';
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
