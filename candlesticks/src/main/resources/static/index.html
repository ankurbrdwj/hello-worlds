<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candlestick Chart - Live View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #252525;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #b0b0b0;
            font-weight: 500;
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #e0e0e0;
            font-size: 14px;
            min-width: 150px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        button {
            padding: 8px 16px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            align-self: flex-end;
        }

        button:hover {
            background-color: #357abd;
        }

        button:active {
            background-color: #2868a8;
        }

        button:disabled {
            background-color: #3a3a3a;
            cursor: not-allowed;
        }

        #chart {
            background-color: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }

        .status {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #252525;
            border-radius: 4px;
            font-size: 13px;
            color: #b0b0b0;
        }

        .status.error {
            background-color: #4a2525;
            color: #ff6b6b;
        }

        .status.success {
            background-color: #254a25;
            color: #6bff6b;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auto-refresh input[type="checkbox"] {
            min-width: auto;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Candlestick Chart Viewer</h1>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="isin">ISIN:</label>
                <select id="isin">
                    <option value="">Select instrument...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="minutes">Time Range (minutes):</label>
                <input type="number" id="minutes" value="30" min="1" max="1440">
            </div>

            <div class="control-group auto-refresh">
                <input type="checkbox" id="autoRefresh">
                <label for="autoRefresh">Auto-refresh every 5s</label>
            </div>

            <button id="loadBtn">Load Chart</button>
            <button id="refreshBtn">Refresh</button>
        </div>

        <div id="chart"></div>
        <div id="status" class="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="js/chart.js"></script>
</body>
</html>
