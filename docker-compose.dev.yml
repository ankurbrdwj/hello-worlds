services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: price_alerts
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./price-alert/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dev-net]

  kafka:
    image: apache/kafka:3.9.0
    container_name: dev-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [dev-net]

  conduktor-console:
    image: conduktor/conduktor-console:latest
    container_name: dev-conduktor
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9080:8080"
    environment:
      CDK_DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/conduktor
      CDK_ADMIN_EMAIL: admin@admin.io
      CDK_ADMIN_PASSWORD: Admin123!
      CDK_CLUSTERS_0_ID: local
      CDK_CLUSTERS_0_NAME: Local Dev Kafka
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      CDK_CLUSTERS_0_SECURITY_PROTOCOL: PLAINTEXT
    networks: [dev-net]

  # ── Services ────────────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./user-service
    container_name: dev-user-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [dev-net]

  price-alert:
    build:
      context: ./price-alert
    container_name: dev-price-alert
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "9095:9095"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/price_alerts
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # market-feed runs outside this compose; disable auto-connect to avoid startup errors
      MARKET_FEED_ENABLED: "false"
      MARKET_FEED_WEBSOCKET_URL: ws://host.docker.internal:9090/quotes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9095/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [dev-net]

volumes:
  postgres_data:

networks:
  dev-net:
    driver: bridge