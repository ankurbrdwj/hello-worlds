plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ankur'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations.all {
	resolutionStrategy {
		force 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
		force 'com.fasterxml.jackson.core:jackson-core:2.18.2'
		force 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
	}
	// Exclude log4j1 entirely
	exclude group: 'org.slf4j', module: 'slf4j-log4j12'
	exclude group: 'log4j', module: 'log4j'
	// Exclude Spark's log4j2→SLF4J binding so Spring Boot's logback wins
	exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-rest-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Spark 3.5 still uses javax.servlet; Spring Boot 4 migrated to jakarta.servlet
	runtimeOnly 'javax.servlet:javax.servlet-api:4.0.1'

	// Apache Spark
	implementation('org.apache.spark:spark-core_2.13:3.5.4') {
		exclude group: 'org.slf4j', module: 'slf4j-log4j12'
		exclude group: 'log4j', module: 'log4j'
	}
	implementation('org.apache.spark:spark-sql_2.13:3.5.4') {
		exclude group: 'org.slf4j', module: 'slf4j-log4j12'
		exclude group: 'log4j', module: 'log4j'
	}
}

// Spark requires access to internal JDK APIs on Java 17+
def sparkJvmArgs = [
	'--add-opens=java.base/java.lang=ALL-UNNAMED',
	'--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
	'--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
	'--add-opens=java.base/java.io=ALL-UNNAMED',
	'--add-opens=java.base/java.net=ALL-UNNAMED',
	'--add-opens=java.base/java.nio=ALL-UNNAMED',
	'--add-opens=java.base/java.util=ALL-UNNAMED',
	'--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
	'--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
	'--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
	'--add-opens=java.base/sun.nio.cs=ALL-UNNAMED',
	'--add-opens=java.base/sun.security.action=ALL-UNNAMED',
	'--add-opens=java.base/sun.util.calendar=ALL-UNNAMED',
]

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs sparkJvmArgs
}

tasks.named('bootRun') {
	jvmArgs sparkJvmArgs
}

tasks.register('readParquet', JavaExec) {
	group = 'spark'
	description = 'Read a Parquet file: -PparquetDir=<path>'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.ankur.spark.basic.ReadParquet'
	def dir = project.findProperty('parquetDir') ?: "${buildDir}/wc-output"
	args dir
	jvmArgs sparkJvmArgs
}

tasks.register('wordCount', JavaExec) {
	group = 'spark'
	description = 'Run WordCount: -PinputFile=<path> -PoutputDir=<path>'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.ankur.spark.basic.WordCount'
	def input = project.findProperty('inputFile') ?: 'src/main/resources/sample.txt'
	def output = project.findProperty('outputDir') ?: "${buildDir}/wc-output"
	args input, output
	jvmArgs sparkJvmArgs
}
