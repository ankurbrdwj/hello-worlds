spring.application.name=outbox-pattern

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/outboxdb
spring.datasource.username=outboxuser
spring.datasource.password=outboxpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Enable scheduling
spring.task.scheduling.pool.size=2

# Logging
logging.level.com.ankur.outbox=DEBUG
logging.level.org.springframework.jdbc=DEBUG
