spring.application.name=api-gateway
server.port=8080

# ============================================
# RATE LIMITER CONFIGURATION
# ============================================
# Type: "resilience4j" (in-memory) or "redis" (distributed)
gateway.ratelimiter.type=resilience4j

# Rate limit: requests per window
gateway.ratelimiter.limit=100
gateway.ratelimiter.window-seconds=1

# Resilience4j specific
gateway.ratelimiter.timeout-millis=500

# Redis specific (only used when type=redis)
gateway.ratelimiter.redis-key-prefix=rate-limit
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.ankur.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p){magenta} %clr([%X{requestId:---------}]){cyan} %clr(%-40.40logger{39}){blue} %clr(:){faint} %m%n

# ============================================
# GATEWAY SETTINGS
# ============================================
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10000