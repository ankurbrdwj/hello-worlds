spring.application.name=spring-redis

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Used by CacheRestClient if the processor runs inside this same process
cache.rest.base-url=${CACHE_REST_BASE_URL:http://localhost:8080}

# Size of each object pre-loaded into Redis on startup (MB)
loader.object-size-mb=${LOADER_OBJECT_SIZE_MB:20}
